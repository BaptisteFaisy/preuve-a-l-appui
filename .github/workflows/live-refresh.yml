name: Démo live (données réelles)

# Rafraîchit et publie l'instantané réel toutes les quinze minutes.
#
# La démo du site public relit ce fichier à l'exécution
# (`site/src/demo/live-fetch.ts`) : elle montre donc l'état COURANT de l'app
# installée sur le site de démonstration, avec son âge affiché. Avant,
# l'instantané était embarqué à la construction — figé au dernier déploiement,
# ce qui n'était plus une démo live.
#
# Découpé en deux jobs, parce que le jeton Atlassian ne quitte pas la maison :
#
#   1. relire  — runner self-hosted (la machine a `~/.atlassian-api-token` sur
#      disque, jamais enregistré dans GitHub) : lit la propriété du ticket et
#      transmet l'instantané pseudonymisé en artefact. Aucune dépendance npm.
#   2. publier — runner hébergé : construit le site et le pousse sur Pages,
#      comme `site.yml`.
#
# Aucun des deux n'écrit dans le dépôt : `main` n'est jamais touché, aucune
# protection de branche n'est contournée.
#
# Sans jeton (fichier absent sur le runner), le run sort **vert** avec un
# avertissement et ne publie rien : un job entièrement sauté était compté
# « failure » par GitHub, soit un run rouge toutes les quinze minutes pour
# rien. Le site garde alors son instantané embarqué et l'affiche.
#
# Éligibilité « Runs on Atlassian » préservée : l'app garde ses deux
# déclencheurs STATIQUES, le site lit un fichier public sur sa propre origine,
# jamais l'app en direct (docs/LIVE-DEMO.md §6).
#
# Budget : 5 minutes par job (règle CI de fin octobre 2026), un seul run à la
# fois, `fetch-depth: 1`, pas de `cache: npm` sur le runner self-hosted (il
# archiverait 1,6 Go sur la ligne domestique — leçon du run 43607021687).
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

# Même groupe de concurrence que le déploiement du site : une seule publication
# à la fois, et on n'annule pas une publication en cours.
concurrency:
  group: pages-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ─── 1. relire : le jeton reste sur la machine ────────────────────────────
  relire:
    name: relire-dans-jira
    runs-on: [self-hosted, linux, x64, preuve-a-l-appui-worker]
    timeout-minutes: 5
    # Le verdict du job est lu par le job de publication : sans jeton, celui-ci
    # ne tourne pas (et le run reste vert, le bilan étant porté par `relire`).
    outputs:
      present: ${{ steps.jeton.outputs.present }}
      source: ${{ steps.jeton.outputs.source }}
    env:
      # Le jeton vient du disque du runner, lu par l'outil
      # (`tools/refresh-live-snapshot.mjs`), et surtout PAS d'un secret GitHub :
      # un secret du dépôt écrasait ce fichier local, et Jira répondait 404 —
      # il masque une absence de permission par 404, pas 401 (run 43612827396,
      # 14/11/2026 : le même ticket lu en HTTP 200 depuis la machine avec le
      # fichier, et 404 depuis le runner avec le secret). Le dépôt est public :
      # un identifiant de moins à y enregistrer est toujours un bon échange.
      ATLASSIAN_SITE: ${{ vars.ATLASSIAN_SITE || 'one-atlas-cndz.atlassian.net' }}
      ATLASSIAN_ISSUE: ${{ vars.ATLASSIAN_ISSUE || 'PRF-1' }}
    steps:
      - name: Jeton Atlassian présent ?
        id: jeton
        shell: bash
        run: |
          if [ -r "$HOME/.atlassian-api-token" ]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
            echo 'source=fichier du runner' >> "$GITHUB_OUTPUT"
            echo 'Jeton lu dans ~/.atlassian-api-token : il ne quitte pas la machine.'
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo 'source=aucun' >> "$GITHUB_OUTPUT"
            echo "::warning::Aucun jeton Atlassian sur ce runner (~/.atlassian-api-token absent) : rien n'est relu ni publié. Le site garde son instantané embarqué et l'affiche."
          fi

      - uses: actions/checkout@v4
        if: steps.jeton.outputs.present == 'true'
        with:
          fetch-depth: 1
          persist-credentials: false
          clean: false

      - uses: actions/setup-node@v4
        if: steps.jeton.outputs.present == 'true'
        with:
          node-version: '22'
          # Pas de `cache: npm` : ce job n'installe aucune dépendance (l'outil
          # est du node pur) et le runner est persistant.

      - name: Instantané relu dans Jira
        if: steps.jeton.outputs.present == 'true'
        run: node tools/refresh-live-snapshot.mjs

      - name: Instantané transmis
        if: steps.jeton.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: live-snapshot
          path: site/public/live-snapshot.json
          retention-days: 1
          if-no-files-found: error

  # ─── 2. publier : construction et Pages, comme site.yml ──────────────────
  publier:
    name: publier-sur-pages
    needs: relire
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: needs.relire.outputs.present == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          clean: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Dépendances (npm ci)
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Instantané reçu
        uses: actions/download-artifact@v4
        with:
          name: live-snapshot
          path: site/public

      - name: Garde — taille des fichiers et des fonctions
        run: npm run check:limits

      - name: Types du site (tsc -p site/tsconfig.json)
        run: npm run site:typecheck

      - name: Tests de la relecture et de l'âge
        run: npx vitest run tests/site

      - name: Construction du site (vite build)
        run: npm run site:build

      - name: Artefact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

      - name: Publication sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Bilan
        if: always()
        shell: bash
        run: |
          echo "Instantané relu par ${{ needs.relire.outputs.source }} et site republié."
