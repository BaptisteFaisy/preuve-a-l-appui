name: Démo live (données réelles)

# Rafraîchit et publie l'instantané réel toutes les dix minutes.
#
# La démo du site public relit ce fichier à l'exécution
# (`site/src/demo/live-fetch.ts`) : elle montre donc l'état COURANT de l'app
# installée sur le site de démonstration, avec son âge affiché. Avant,
# l'instantané était embarqué à la construction — figé au dernier déploiement,
# ce qui n'était plus une démo live.
#
# Le workflow régénère l'instantané dans le checkout, construit le site et le
# déploie : il n'écrit rien dans le dépôt, `main` n'est jamais touché.
#
# Sans jeton Atlassian (`gh secret set ATLASSIAN_API_TOKEN`), le run se termine
# en vert avec un avertissement : rien n'est relu, rien n'est publié, et le
# site garde son instantané embarqué. Inutile d'avoir un run rouge toutes les
# dix minutes.
#
# Éligibilité « Runs on Atlassian » préservée : l'app garde ses deux
# déclencheurs STATIQUES, le site lit un fichier public sur sa propre origine,
# jamais l'app en direct (docs/LIVE-DEMO.md §6). `tools/check-eligibility.mjs`
# continue de le vérifier dans `ci.yml`.
#
# Budget : 5 minutes par job (règle CI de fin octobre 2026), un seul run à la
# fois, `fetch-depth: 1`.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

# Même groupe de concurrence que le déploiement du site : un seul publication à
# la fois, et on n'annule pas une publication en cours.
concurrency:
  group: pages-main
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    name: relire-et-publier
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      ATLASSIAN_API_TOKEN: ${{ secrets.ATLASSIAN_API_TOKEN }}
      ATLASSIAN_EMAIL: ${{ secrets.ATLASSIAN_EMAIL }}
      ATLASSIAN_SITE: ${{ vars.ATLASSIAN_SITE || 'one-atlas-cndz.atlassian.net' }}
      ATLASSIAN_ISSUE: ${{ vars.ATLASSIAN_ISSUE || 'PRF-1' }}
    steps:
      # Sans jeton, le workflow n'échoue pas en rouge toutes les dix minutes :
      # il le dit (avertissement) et ne publie rien. Un job entièrement sauté
      # était compté comme « failure » par GitHub — du bruit, pas un signal.
      - name: Jeton Atlassian présent ?
        id: jeton
        shell: bash
        env:
          TOKEN: ${{ secrets.ATLASSIAN_API_TOKEN }}
        run: |
          if [ -n "${TOKEN:-}" ]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
            echo 'Jeton présent : relecture et publication en cours.'
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo '::warning::Jeton ATLASSIAN_API_TOKEN absent : rien n\'est relu ni publié. Le site garde son instantané embarqué (gh secret set ATLASSIAN_API_TOKEN --repo Tradoooo/preuve-a-l-appui).'
          fi

      - uses: actions/checkout@v4
        if: steps.jeton.outputs.present == 'true'
        with:
          fetch-depth: 1
          persist-credentials: false
          clean: false

      - uses: actions/setup-node@v4
        if: steps.jeton.outputs.present == 'true'
        with:
          node-version: '22'
          # Runner hébergé, comme `site.yml` : le cache npm passe par le service
          # GitHub et c'est rapide. Ce qui a mangé les 5 minutes du job
          # d'éligibilité le 14/11/2026, c'était un runner self-hosted archivant
          # 1,6 Go sur ma ligne domestique — pas le cas ici, et ce job court
          # bien `npm ci`, contrairement à lui.
          cache: npm

      - name: Dépendances (npm ci)
        if: steps.jeton.outputs.present == 'true'
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Instantané relu dans Jira
        if: steps.jeton.outputs.present == 'true'
        run: node tools/refresh-live-snapshot.mjs

      - name: Garde — taille des fichiers et des fonctions
        if: steps.jeton.outputs.present == 'true'
        run: npm run check:limits

      - name: Types du site (tsc -p site/tsconfig.json)
        if: steps.jeton.outputs.present == 'true'
        run: npm run site:typecheck

      - name: Tests de la relecture et de l'âge
        if: steps.jeton.outputs.present == 'true'
        run: npx vitest run tests/site

      - name: Construction du site (vite build)
        if: steps.jeton.outputs.present == 'true'
        run: npm run site:build

      - name: Artefact Pages
        if: steps.jeton.outputs.present == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

      - name: Publication sur GitHub Pages
        if: steps.jeton.outputs.present == 'true'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Bilan
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.jeton.outputs.present }}" = 'true' ]; then
            echo 'Instantané relu dans Jira et site republié.'
          else
            echo 'Rien n\'a été relu ni publié : jeton Atlassian absent.'
          fi

