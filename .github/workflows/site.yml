name: Site (GitHub Pages)

# Publie le site public sur GitHub Pages : https://baptistefaisy.github.io/preuve-a-l-appui/
#
# Le site est construit par Vite depuis `site/` ; il embarque le VRAI moteur de
# l'app (`src/domain`, `src/handlers`) et le jeu de démonstration PAY-123, donc
# toute modification du domaine peut changer le site : ce workflow se déclenche
# aussi sur ces chemins.
#
# Budget : 5 minutes par job (règle CI de fin octobre 2026). Le build Vite dure
# quelques secondes une fois les dépendances présentes ; le magasin partagé du
# runner évite une installation complète (voir `.github/workflows/ci.yml`).
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "src/**"
      - "tests/helpers/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/site.yml"
  workflow_dispatch:

# Un seul déploiement à la fois ; on n'annule pas un déploiement en cours
# (un site à moitié publié vaut mieux qu'un site cassé).
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: build-site
    runs-on: [self-hosted, linux, x64, preuve-a-l-appui-worker]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          clean: false

      - name: Nettoyage du workspace (node_modules conservé)
        shell: bash
        run: git clean -ffdx -e /node_modules -e /.npm-state -e /dist -e /build -e /site/dist

      - name: Dépendances (magasin partagé, installation seulement si le lock change)
        shell: bash
        run: |
          echo "$HOME/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/bin:$PATH"
          export NPM_CONFIG_CACHE="$HOME/.npm-ci-cache"
          LOCK_HASH="$(sha256sum package-lock.json | cut -d' ' -f1)"
          MARKER="node_modules/.proof-lock-hash"
          STORE="$HOME/.proof-ci-deps/$LOCK_HASH"
          if [ -d node_modules ] && [ "$LOCK_HASH" = "$(cat "$MARKER" 2>/dev/null)" ]; then
            echo "node_modules deja a jour - installation sautee"
          elif [ -d "$STORE/node_modules" ]; then
            rm -rf node_modules
            cp -al "$STORE/node_modules" node_modules
            printf '%s' "$LOCK_HASH" > "$MARKER"
            echo "node_modules copie depuis le magasin $STORE"
          else
            echo "installation des dependances (a froid)..."
            npm ci --prefer-offline --no-audit --no-fund
            printf '%s' "$LOCK_HASH" > "$MARKER"
            mkdir -p "$STORE" && rm -rf "$STORE/node_modules" \
              && cp -al node_modules "$STORE/node_modules" \
              && echo "magasin alimente : $STORE"
          fi

      - name: Types du site (tsc -p site/tsconfig.json)
        run: npm run site:typecheck

      - name: Construction du site (vite build)
        run: npm run site:build

      - name: "Garde — aucune ressource absolue hors base Pages"
        shell: bash
        run: |
          # Pages sert le site sous /preuve-a-l-appui/ : une URL absolue en
          # racine (/assets/…) casserait la page. On vérifie le build.
          if grep -rlE '(href|src)="/[^/]' site/dist --include='*.html' >/dev/null 2>&1; then
            echo "::error::référence absolue racine dans site/dist (base Pages incorrecte)"
            grep -rnE '(href|src)="/[^/]' site/dist --include='*.html' | head -5
            exit 1
          fi
          echo "OK : aucune référence absolue racine"

      - name: Artefact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    name: deploy-pages
    needs: build
    runs-on: [self-hosted, linux, x64, preuve-a-l-appui-worker]
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publication sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
